<style>

.btn.f,.gen button[aria-pressed=true]{color:#06241B}.btn.f:hover{color:#fff}.btn:hover{color:#06241B}.btn.f{background:#8FD3B8}.s{background:var(--card);color:var(--tx)}.btn{background:var(--card)}.gen::before{background:linear-gradient(135deg,#8FD3B8,#5FB89B)}}

 linear-gradient(160deg,#0B3027 0%,#145243 60%,#1D6150 100%);

.logo{width:68px;height:68px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:2px solid var(--gold);box-shadow:0 0 0 6px rgba(201,160,74,.15)}
.logo svg{width:34px;height:34px}
h1{margin:0;font-size:clamp(22px,5vw,34px);font-weight:800;letter-spacing:-.01em}
.jj{display:inline-block;margin:12px 0 0;padding:6px 18px;border-radius:99px;border:1px solid rgba(233,212,155,.55);background:rgba(233,212,155,.12);color:var(--gold2);font-weight:600;font-size:clamp(14px,3.3vw,17px)}
main{max-width:980px;margin:-56px auto 40px;padding:0 16px}
.gen{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:16px;padding:6px;box-shadow:0 8px 24px rgba(15,61,50,.14);border:1px solid var(--ln)}
.gen::before{content:"";position:absolute;top:6px;bottom:6px;left:6px;width:calc(50% - 6px);border-radius:11px;background:linear-gradient(135deg,var(--g),var(--g2));transition:transform .3s ease}
.gen.a::before{transform:translateX(100%)}
.gen button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:none;padding:14px 8px;font:700 16px var(--f);color:var(--mu);cursor:pointer;transition:color .25s}
.gen button[aria-pressed=true]{color:#fff}
.gen svg{width:20px;height:20px}
.tabs{display:flex;gap:26px;justify-content:center;margin-top:22px;border-bottom:1px solid var(--ln)}
.tabs button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 4px 12px;font:700 15px var(--f);color:var(--mu);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button svg{width:18px;height:18px}
.tabs button[aria-selected=true]{color:var(--g);border-bottom-color:var(--gold)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.k{background:var(--card);border-radius:16px;padding:16px;border:1px solid var(--ln);box-shadow:0 2px 10px rgba(15,61,50,.06);animation:in .35s ease both}

.btn:hover{background:var(--g);color:#fff;transform:translateY(-1px)}
.btn.f{background:var(--g);color:#fff}.btn.f:hover{background:var(--g2);border-color:var(--g2)}
.sw{position:relative;margin-bottom:8px}
.sw svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mu)}
.s{width:100%;padding:14px 14px 14px 44px;border:1px solid var(--ln);border-radius:12px;font:inherit;background:#fff}
.ct{color:var(--mu);font-size:13px;margin:0 0 12px 2px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pg a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;font-weight:600;transition:transform .2s,box-shadow .2s,border-color .2s;animation:in .35s ease both}

.pg a em{margin-left:auto;font-style:normal;color:var(--gold);font-size:20px;transition:transform .2s}
.pg a:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(15,61,50,.12);border-color:var(--gold)}
.pg a:hover em{transform:translateX(3px)}
.kosong{color:var(--mu);padding:18px 0;text-align:center}
footer{text-align:center;color:var(--mu);font-size:13px;padding-bottom:30px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header>
